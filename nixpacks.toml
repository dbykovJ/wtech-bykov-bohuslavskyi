[build]
cmds = [
  "composer install --no-interaction --optimize-autoloader",
  "npm install",
  "npm run tw:build",
  "php artisan config:cache",
  "php artisan route:cache",
  "php artisan view:cache"
]

[release]
cmd = "php artisan migrate --force"

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=$PORT"
