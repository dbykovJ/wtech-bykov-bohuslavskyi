<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Register — SUPERSELL</title>
        <link rel="stylesheet" href="../styles/main.css" />
        <link rel="stylesheet" href="../styles/auth.css" />
    </head>
    <body class="auth-body">
        <nav class="navbar">
            <div class="container navbar__inner">
                <a href="../index.html" class="navbar__logo heading"
                    >SUPERSELL</a
                >

                <div class="navbar__links">
                    <a href="./category.html" class="navbar__link"> Shop </a>
                    <a
                        href="../index.html#top-brand-seller"
                        class="navbar__link"
                        >Brands</a
                    >
                    <a href="../index.html#on-sale" class="navbar__link"
                        >On Sale</a
                    >
                    <a href="../index.html#new-arrivals" class="navbar__link"
                        >New Arrivals</a
                    >
                </div>

                <div class="navbar__search">
                    <div class="navbar__search-inner">
                        <img
                            draggable="false"
                            src="../public/assets/icons/search.svg"
                            alt="search"
                        />
                        <input
                            type="search"
                            placeholder="Search for Products"
                        />
                    </div>
                </div>

                <div class="navbar__icons">
                    <a href="./cart.html">
                        <img
                            draggable="false"
                            src="../public/assets/icons/shopping-cart.svg"
                            alt="Cart"
                        />
                    </a>
                    <a href="./login.html">
                        <img
                            draggable="false"
                            class="navbar__user-icon"
                            src="../public/assets/icons/user.svg"
                            alt="Account"
                        />
                    </a>
                    <button class="navbar__burger" aria-label="Menu">
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>
                </div>
            </div>
        </nav>

        <main class="auth-main">
            <div class="register-box">
                <h1 class="auth-title">Register</h1>

                <form class="auth-form" method="post" action="#">
                    <div class="auth-fields">
                        <input
                            class="register-input"
                            id="name"
                            type="text"
                            name="name"
                            placeholder="Full Name"
                            required
                            autofocus
                        />
                        <input
                            class="register-input"
                            id="phone"
                            type="text"
                            name="phone"
                            placeholder="Phone"
                            required
                        />
                        <input
                            class="register-input"
                            id="password"
                            type="password"
                            name="password"
                            placeholder="Password"
                            required
                        />
                        <input
                            class="register-input"
                            id="confirm-password"
                            type="password"
                            name="password_confirmation"
                            placeholder="Confirm Password"
                            required
                        />
                    </div>

                    <div class="register-actions">
                        <button class="btn-register" type="submit">
                            Register
                        </button>
                        <button
                            class="btn-signin"
                            type="button"
                            onclick="window.location.href = './login.html'"
                        >
                            Have an account? Sign In
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </body>
</html>
